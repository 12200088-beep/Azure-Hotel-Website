<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven Hotel | Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Azure Haven Hotel</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Booking</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="booking-section">

            <h2>Book Your Stay</h2>
            <p>Complete the form below to request your stay at Azure Haven Hotel.</p>

            <form class="booking-form" id="bookingForm">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="checkIn">Check-in Date</label>
                <input type="date" id="checkIn" name="checkIn" required>

                <label for="checkOut">Check-out Date</label>
                <input type="date" id="checkOut" name="checkOut" required>

                <label for="roomType">Room Type</label>
                <select id="roomType" name="roomType" required>
                    <option value="">Select a room</option>
                    <option value="standard">Standard Room</option>
                    <option value="deluxe">Deluxe Room</option>
                    <option value="luxury">Luxury Suite</option>
                </select>

                <label for="guests">Number of Guests</label>
                <select id="guests" name="guests" required>
                    <option value="">Select guests</option>
                    <option value="1">1 Guest</option>
                    <option value="2">2 Guests</option>
                    <option value="3">3 Guests</option>
                    <option value="4">4 Guests</option>
                </select>

                <button type="submit">Book Now</button>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Azure Haven Hotel. All rights reserved.</p>
    </footer>
    <script>
    document.getElementById("bookingForm").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Booking submitted successfully! Thank you for choosing Azure Haven Hotel.");

        this.reset();
    });
</script>

</body>

</html>
