<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven Hotel | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Azure Haven Hotel</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Booking</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">

            <h2>Contact Us</h2>
            <p>
                Have a question? Send us a message and we will be happy to help.
            </p>

            <form class="contact-form">

                <label for="contactName">Full Name</label>
                <input type="text" id="contactName" name="contactName" required>

                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail" name="contactEmail" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Send Message</button>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Azure Haven Hotel. All rights reserved.</p>
    </footer>
    <script>
document.querySelector(".contact-form").addEventListener("submit", function(event) {
    event.preventDefault();

    alert("Message sent successfully! Thank you for contacting Azure Haven Hotel.");

    this.reset();
});
</script>

</body>

</html>
